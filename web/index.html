<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="GoldenHour: real-time emergency coordination between reporters, dispatch, ambulance crews and hospitals. Demonstration system." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GoldenHour" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>GoldenHour - Emergency Coordination</title>
    <script>
      // Apply saved appearance before the first paint so there is no flash of the wrong theme.
      try {
        var s = JSON.parse(localStorage.getItem('gh-settings') || '{}');
        var dark = s.theme === 'dark' || ((s.theme || 'system') === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var el = document.documentElement;
        el.dataset.theme = dark ? 'dark' : 'light';
        el.dataset.text = s.textSize || 'normal';
        el.dataset.motion = s.reduceMotion === 'on' ? 'reduced' : 'system';
        el.dataset.compact = s.compact ? 'on' : 'off';
        var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', dark ? '#000000' : '#e8edf1');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>GoldenHour needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
